name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 and 24 are the
        # newer LTS lines the CLI is expected to keep working on.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `pretest` compiles to dist/, so this covers the TypeScript build, the
      # vitest suite (including the stub-Jira end-to-end tests), and the
      # generated-skill staleness check in test/skill.test.ts.
      - name: Build and test
        run: npm test
